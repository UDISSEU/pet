name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  compatibility:
    name: Python ${{ matrix.python-version }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies
        run: python -m pip install -r desktop_pet_pixel_art/requirements.txt
      - name: Check dependency consistency
        run: python -m pip check
      - name: Run unit tests without a display
        run: PYTHONPATH=src python -m unittest discover -s tests -t . -v
        working-directory: desktop_pet_pixel_art

  quality:
    name: Ruff, Bandit and coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk
      - name: Install Python dependencies and quality tools
        run: python -m pip install -r desktop_pet_pixel_art/requirements.txt ruff bandit coverage pip-audit
      - name: Check dependency consistency
        run: python -m pip check
      - name: Audit dependencies
        run: python -m pip_audit -r desktop_pet_pixel_art/requirements.txt
      - name: Run Ruff
        run: ruff check --isolated --select E4,E7,E9,F --ignore E402,F401,F841,E731 src tests
        working-directory: desktop_pet_pixel_art
      - name: Run Bandit
        run: bandit -q -r src --severity-level high --confidence-level high
        working-directory: desktop_pet_pixel_art
      - name: Run tests with coverage
        run: |
          PYTHONPATH=src coverage run --source=src -m unittest discover -s tests -t . -v
          coverage report --show-missing
        working-directory: desktop_pet_pixel_art

  graphics:
    name: Tk graphical tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb xauth
      - name: Install Python dependencies
        run: python -m pip install -r desktop_pet_pixel_art/requirements.txt
      - name: Run graphical window tests
        run: PYTHONPATH=src xvfb-run -a python -m unittest discover -s tests -p test_ui_windows.py -v
        working-directory: desktop_pet_pixel_art

  clean-install:
    name: Clean installation and startup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y python3-venv python3-tk xvfb xauth
      - name: Install into an isolated user profile
        working-directory: desktop_pet_pixel_art
        run: |
          test_home="$(mktemp -d)"
          trap 'rm -rf "$test_home"' EXIT
          export HOME="$test_home/home"
          export XDG_DATA_HOME="$test_home/data"
          mkdir -p "$HOME" "$XDG_DATA_HOME"
          ./install.sh --yes
          test -x .venv/bin/python
          test -f "$XDG_DATA_HOME/applications/nova.desktop"
          timeout --signal=TERM --kill-after=3s 8s \
            xvfb-run -a .venv/bin/python src/desktop_pet.py \
            > "$test_home/startup.log" 2>&1 || status=$?
          if [ "${status:-0}" -ne 124 ]; then
            cat "$test_home/startup.log"
            echo "Application startup smoke test failed (status ${status:-0})." >&2
            exit 1
          fi
          mkdir -p "$HOME/.config/desktop_pet"
          printf '%s\n' 'preserve me' > "$HOME/.config/desktop_pet/settings.json"
          export XDG_DATA_HOME="$test_home/changed-data"
          ./install.sh --uninstall --yes
          test ! -e .venv
          test ! -e "$XDG_DATA_HOME/applications/nova.desktop"
          test ! -e "$test_home/data/applications/nova.desktop"
          test -f "$HOME/.config/desktop_pet/settings.json"
