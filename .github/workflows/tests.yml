name: Testes

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependências do sistema
        run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - name: Instalar dependências Python
        run: python -m pip install -r desktop_pet_pixel_art/requirements.txt
      - name: Executar testes
        run: xvfb-run -a python -m unittest discover -s tests -v
        working-directory: desktop_pet_pixel_art
